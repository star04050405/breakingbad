<script>
const SEASONS=[{"s":1,"year":"2008","eps":[[1,"Pilot","2008.01.20","确诊绝症的中学化学老师，与昔日学生合伙制毒，想为家人留一条财务后路。","起点 · 一切开始"],[2,"Cat's in the Bag...","2008.01.27","首次制毒的恶果接踵而至，Walt 与 Jesse 手忙脚乱收拾残局；Skyler 对丈夫的反常起了疑心。",""],[3,"...And the Bag's in the River","2008.02.10","处理「第一次」留下的麻烦时，Walt 面临撕扯内心的道德抉择；Hank 查到一条不安的线索。",""],[4,"Cancer Man","2008.02.17","全家消化癌症确诊的消息、权衡治疗方案；Jesse 回到疏远多年的父母家，旧日矛盾一并爆发。",""],[5,"Gray Matter","2008.02.24","要不要治病？家人为 Walt 办了场情绪激昂的劝医会，富有的昔日合伙人伸出援手；Jesse 想回归正轨。",""],[6,"Crazy Handful of Nothin'","2008.03.02","化疗让 Walt 越发强硬，他逼 Jesse 通过火爆的新经销商扩张；Hank 的调查逼近。",""],[7,"A No-Rough-Stuff-Type Deal","2008.03.09","为满足不断加码的拿货要求，两人铤而走险去搞关键原料；Skyler 的迎婴会上家庭暗流涌动。",""]]},{"s":2,"year":"2009","eps":[[1,"Seven Thirty-Seven","2009.03.08","Walt 给家人定下天文数字的「目标」，同时要防备越来越危险的经销商；Skyler 被他的反常吓到。",""],[2,"Grilled","2009.03.15","两人落入偏执经销商的股掌、拼命寻路逃生；Hank 顺着 Walt 失踪的线索追了过来。",""],[3,"Bit by a Dead Bee","2009.03.22","Walt 与 Jesse 编织天衣无缝的假故事解释失踪；Hank 劫后难平，Skyler 追问丈夫的版本。",""],[4,"Down","2009.03.29","Skyler 越走越远，Walt 努力拉回家人的心；Jesse 被扫地出门，四处寻找容身之处。",""],[5,"Breakage","2009.04.05","资金见底，两人搭起街头分销网络；Hank 被创伤缠身，White 家内部张力加深。",""],[6,"Peekaboo","2009.04.12","Jesse 寻访抢劫下线的瘾君子，却在污浊的家里撞见一个被忽视的孩子；Walt 医疗费的谎言开始松脱。",""],[7,"Negro y Azul","2009.04.19","蓝色冰毒声名鹊起，Walt 逼 Jesse 扩张地盘；Hank 领教新差事的残酷，Jesse 与女房东越走越近。",""],[8,"Better Call Saul","2009.04.26","手下被抓，两人求助一位浮夸的刑事律师——他另辟蹊径的办法也许能保住生意和身份。","衍生剧《风骚律师》本尊登场"],[9,"4 Days Out","2009.05.03","自觉时日无多，Walt 拉 Jesse 去沙漠赶工四天，一场意外却让回家成了难题。",""],[10,"Over","2009.05.10","检查结果向好，Walt 反而无法安于平凡，把躁动发泄在修房整屋上；Jesse 与 Jane 越走越近。",""],[11,"Mandala","2009.05.17","生意遭重创后两人寻找新经销商；Jesse 和 Jane 感情升温，Skyler 在职场上面临道德抉择。",""],[12,"Phoenix","2009.05.24","Skyler 临产，Walt 却被一桩关键生意叫走；Jesse 与 Jane 的关系开始侵蚀他与 Walt 的合伙。",""],[13,"ABQ","2009.05.31","Jesse 在私痛中沉沦，Walt 术前部署、确保家人未来；Skyler 对他秘密生活的怀疑愈发灼热。",""]]},{"s":3,"year":"2010","eps":[[1,"No Más","2010.03.21","悲剧过后，Walt 被负罪感啃噬，强撑家的完整；Jesse 直面过往，新的威胁正向阿尔伯克基逼近。",""],[2,"Caballo sin Nombre","2010.03.28","分居与路侧冲突令 Walt 晕头转向；Jesse 想夺回旧宅，两个神秘 (function(){
var K='bb62log';
var FLAT=[];// {s,e,ti,dt,ds,bd,idx}
SEASONS.forEach(function(sn){sn.eps.forEach(function(ep){FLAT.push({s:sn.s,e:ep[0],ti:ep[1],dt:ep[2],ds:ep[3],bd:ep[4],idx:FLAT.length})})});
function sym(t){var m=t.replace(/[^A-Za-z]/g,'');return (m.charAt(0)+m.charAt(1)).toUpperCase()===''?'··':(m.charAt(0).toUpperCase()+(m.charAt(1)||'').toLowerCase())||'·'}
function get(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(x){return{}}}
function set(d){localStorage.setItem(K,JSON.stringify(d))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var main=document.getElementById('bbMain');
SEASONS.forEach(function(sn,si){
  var sec=document.createElement('section');sec.className='bb-season';
  var total=sn.eps.length;
  var h=document.createElement('div');h.className='bb-sh';
  h.innerHTML='<span class="sn">S'+sn.s+'</span><span class="sy">'+sn.year+'</span><span class="sc" data-sc="'+sn.s+'">0 / '+total+'</span>';
  sec.appendChild(h);
  var g=document.createElement('div');g.className='bb-grid';
  sn.eps.forEach(function(ep){
    var c=document.createElement('div');c.className='bb-cell';c.dataset.s=sn.s;c.dataset.e=ep[0];
    if(ep[4])c.classList.add('star');
    c.innerHTML='<span class="n">'+ep[0]+'</span><div class="t">'+esc(sym(ep[1]))+'</div><div class="w">S'+sn.s+'E'+ep[0]+'</div>';
    c.addEventListener('click',function(){openSheet(sn.s,ep[0])});
    g.appendChild(c);
  });
  sec.appendChild(g);main.appendChild(sec);
});
function refresh(){
  var d=get(),n=0;
  document.querySelectorAll('.bb-cell').forEach(function(c){
    var on=!!d[c.dataset.s+'-'+c.dataset.e];
    c.classList.toggle('hit',on);if(on)n++;
  });
  SEASONS.forEach(function(sn){
    var m=0;sn.eps.forEach(function(ep){if(d[sn.s+'-'+ep[0]])m++});
    var el=document.querySelector('[data-sc="'+sn.s+'"]');if(el)el.textContent=m+' / '+sn.eps.length;
  });
  document.getElementById('bbCnt').textContent=n;
  var p=Math.round(n/62*100);
  document.getElementById('bbPct').textContent=p+'%';
  document.getElementById('bbFill').style.width=p+'%';
  document.getElementById('bbFin').classList.toggle('on',n===62);
  locate();
}
/* 自动滚动定位：打开时跳到最后看过的那集 */
var located=false;
function locate(){
  if(located)return;located=true;
  var d=get(),ks=Object.keys(d);if(!ks.length)return;
  var last=-1;
  FLAT.forEach(function(f,i){if(d[f.s+'-'+f.e])last=i});
  if(last<0)return;
  if(ks.length===62)return; /* 全满：顶栏彩蛋已说明，不跳 */
  var g=document.querySelectorAll('.bb-cell')[last];if(!g)return;
  setTimeout(function(){
    g.scrollIntoView({block:'center',behavior:'auto'});
    g.classList.add('pulse');
    setTimeout(function(){g.classList.remove('pulse')},2800);
  },120);
}
/* sheet */
var cur=-1;
var mask=document.getElementById('bbMask'),sheet=document.getElementById('bbSheet');
function openSheet(s,e){
  var f=FLAT.filter(function(x){return x.s===s&&x.e===e})[0];if(!f)return;
  cur=f.idx;fill(f);mask.classList.add('on');sheet.classList.add('on');
}
function fill(f){
  document.getElementById('bsNo').textContent='S'+f.s+' · E'+f.e;
  document.getElementById('bsTitle').textContent=f.ti;
  document.getElementById('bsDate').textContent='首播 '+f.dt;
  var bd=document.getElementById('bsBadge');
  if(f.bd){bd.style.display='inline-block';bd.textContent='★ '+f.bd}else bd.style.display='none';
  document.getElementById('bsDesc').textContent=f.ds;
  var on=!!get()[f.s+'-'+f.e];
  var bt=document.getElementById('bsToggle');
  bt.className='bs-toggle '+(on?'on':'off');
  bt.textContent=on?'已看过 · 撤销':'看过 ✓';
  document.getElementById('bsPrev').disabled=(cur===0);
  document.getElementById('bsNext').disabled=(cur===FLAT.length-1);
}
function closeSheet(){mask.classList.remove('on');sheet.classList.remove('on');cur=-1}
document.getElementById('bsToggle').addEventListener('click',function(){
  if(cur<0)return;var f=FLAT[cur],d=get(),k=f.s+'-'+f.e;
  d[k]=!d[k];if(!d[k])delete d[k];set(d);fill(f);refresh();
});
document.getElementById('bsPrev').addEventListener('click',function(){if(cur>0){cur--;fill(FLAT[cur])}});
document.getElementById('bsNext').addEventListener('click',function(){if(cur<FLAT.length-1){cur++;fill(FLAT[cur])}});
document.getElementById('bbClose').addEventListener('click',closeSheet);
mask.addEventListener('click',closeSheet);
document.addEventListener('keydown',function(ev){
  if(cur<0)return;
  if(ev.key==='ArrowLeft'&&cur>0){cur--;fill(FLAT[cur])}
  if(ev.key==='ArrowRight'&&cur<FLAT.length-1){cur++;fill(FLAT[cur])}
  if(ev.key==='Escape')closeSheet();
});
/* reset 两步 */
var rb=document.getElementById('bbReset'),armed=false;
rb.addEventListener('click',function(){
  if(!armed){armed=true;rb.classList.add('arm');rb.textContent='再点一次，确认清空全部 62 集记录';
    setTimeout(function(){if(armed){armed=false;rb.classList.remove('arm');rb.textContent='清空全部记录'}},2600);
  }else{armed=false;rb.classList.remove('arm');rb.textContent='清空全部记录';localStorage.removeItem(K);refresh()}
});
refresh();
})();
</script>

</html>
